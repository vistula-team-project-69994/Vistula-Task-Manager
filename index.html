<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <header class="header">
      <div>
        <p class="eyebrow">Vistula Team Project</p>
        <h1>Task Manager</h1>
        <p class="subtitle">Organize your tasks in one place.</p>
      </div>
      <span class="student">Student ID: <strong id="student-id">69994</strong></span>
    </header>

    <section class="panel">
      <h2 id="form-heading">Add a task</h2>
      <form id="task-form">
        <label for="task-title">Title</label>
        <input id="task-title" name="title" type="text" placeholder="e.g. Learn Git" required maxlength="200">

        <label for="task-description">Description</label>
        <textarea id="task-description" name="description" rows="3" placeholder="Optional details"></textarea>

        <div class="form-actions">
          <button id="task-submit" type="submit">Add task</button>
          <button id="cancel-edit" type="button" class="secondary" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="tasks-section">
      <div class="section-heading">
        <h2>Your tasks</h2>
        <span id="task-count">0 tasks</span>
      </div>
      <p id="status-message" role="status" aria-live="polite">Loading tasks…</p>
      <div id="task-list"></div>
    </section>

    <footer>
      <a id="contribution-link" href="contribution.html">Team contribution</a>
    </footer>
  </main>
  <script src="app.js"></script>
</body>

</html>
